# fly.toml app configuration file generated for tsidp-old-water-2360 on 2026-02-14T15:56:13+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'tsidp-old-water-2360'
primary_region = 'fra'

[build]
  image = 'ghcr.io/tailscale/tsidp:latest'

[deploy]
  strategy = 'rolling'

[env]
  TAILSCALE_USE_WIP_CODE = '1'
  TSIDP_ENABLE_STS = '1'
  TS_HOSTNAME = 'idp'
  TS_STATE_DIR = '/data'

[[mounts]]
  source = 'data'
  destination = '/data'
  initial_size = '1GB'
  snapshot_retention = 7
  scheduled_snapshots = true
  auto_extend_size_threshold = 90
  auto_extend_size_increment = '1GB'
  auto_extend_size_limit = '5GB'

[[vm]]
  memory = '256mb'
  cpus = 1
  memory_mb = 256
